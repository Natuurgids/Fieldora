name: Fieldora bootstrap handoff certification

on:
  pull_request:
    paths:
      - "Install-Fieldora-Bootstrap-Handoff.ps1"
      - "src/natureai_next/bootstrap/bootstrap_handoff_cleanup_cli.py"
      - "tests/test_bootstrap_handoff_cleanup.py"
      - "deployment/bootstrap-handoff/compose.yaml"
      - ".github/workflows/bootstrap-handoff-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-handoff-certification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff bootstrap handoff cleanup
        run: python -m ruff check src/natureai_next/bootstrap/bootstrap_handoff_cleanup_cli.py tests/test_bootstrap_handoff_cleanup.py
      - name: Bootstrap handoff cleanup tests
        run: python -m pytest -q tests/test_bootstrap_handoff_cleanup.py
      - name: Parse portable PowerShell handoff installer
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath ./Install-Fieldora-Bootstrap-Handoff.ps1 -Raw
          [void][scriptblock]::Create($text)
          foreach ($needle in @(
            '[ValidateRange(1,90)][int]$RetentionDays = 7',
            'Get-Command docker',
            'EXPIRES-AT-EPOCH',
            'compose.bootstrap-handoff.yaml',
            'network_mode: none',
            'read_only: true',
            'no-new-privileges:true',
            'fieldora-bootstrap-handoff-cleaner'
          )) {
            if (-not $text.Contains($needle)) {
              throw "Portable bootstrap handoff installer is missing: $needle"
            }
          }
          if ($text.Contains('docker.exe') -or $text.Contains('schtasks') -or $text.Contains('Register-ScheduledTask')) {
            throw 'Bootstrap handoff installation must remain OS-neutral and container-based.'
          }
      - name: Certify container isolation contract
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath ./deployment/bootstrap-handoff/compose.yaml -Raw
          foreach ($needle in @(
            'network_mode: none',
            'read_only: true',
            'cap_drop:',
            '- ALL',
            'no-new-privileges:true',
            './bootstrap-handoff:/run/fieldora-bootstrap-handoff'
          )) {
            if (-not $text.Contains($needle)) {
              throw "Bootstrap handoff cleaner isolation contract is missing: $needle"
            }
          }
          foreach ($forbidden in @('fieldora-postgres-trust','fieldora-api-trust','fieldora-governance-dsn','service-trust')) {
            if ($text.Contains($forbidden)) {
              throw "Bootstrap handoff cleaner must not mount protected runtime material: $forbidden"
            }
          }
