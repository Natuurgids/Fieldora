name: Desktop security composition one-shot v2

on:
  push:
    branches:
      - security/native-update-trust-hardening
    paths:
      - ".github/workflows/desktop-security-composition-one-shot-v2.yml"

permissions:
  contents: write

jobs:
  compose-desktop-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/native-update-trust-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install pytest platformdirs
      - name: Apply deterministic composition patch
        run: python scripts/apply_desktop_security_composition.py
      - name: Verify composition contract
        run: |
          python -m compileall -q src/natureai_next/ui/qt/application.py src/natureai_next/bootstrap/cli.py
          python -m pytest -q tests/test_desktop_security_composition.py tests/test_update_application_paths.py tests/test_native_handoff_security.py
      - name: Commit verified composition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/natureai_next/ui/qt/application.py src/natureai_next/bootstrap/cli.py tests/test_desktop_security_composition.py
          git diff --cached --check
          git commit -m "fix(security): bind desktop update and PBAC context"
          git push origin HEAD:security/native-update-trust-hardening
