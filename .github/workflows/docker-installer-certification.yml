name: Fieldora Docker installer certification

on:
  pull_request:
    paths:
      - "Install-Fieldora-Clean.ps1"
      - "Install-Fieldora-Clean-Windows.ps1"
      - "Install-Fieldora-Bootstrap-Handoff.ps1"
      - "src/natureai_next/server/service_trust.py"
      - "src/natureai_next/bootstrap/service_trust_cli.py"
      - "src/natureai_next/bootstrap/certificate_renewer_cli.py"
      - "src/natureai_next/bootstrap/operator_cli.py"
      - ".github/workflows/docker-installer-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          foreach ($path in @('./Install-Fieldora-Clean.ps1','./Install-Fieldora-Clean-Windows.ps1','./Install-Fieldora-Bootstrap-Handoff.ps1')) {
            $text = Get-Content -LiteralPath $path -Raw
            [void][scriptblock]::Create($text)
            Write-Host "$path syntax: OK"
          }

      - name: Certify clean-install trust contract
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath ./Install-Fieldora-Clean.ps1 -Raw
          $required = @(
            'FIELDORA_SERVICE_ID: fieldora-api-local',
            'FIELDORA_SERVICE_ID: fieldora-worker-local',
            'fieldora-postgres-local',
            'fieldora-cert-renewer-local',
            'sslmode=verify-full',
            'clientcert=verify-full',
            'fieldora-service-trust',
            'fieldora-certificate-renewer',
            'fieldora-operator',
            '--tls-certificate',
            '--tls-private-key',
            'restart: unless-stopped',
            'fieldora-postgres-trust',
            'fieldora-worker-trust',
            'fieldora-api-trust',
            'fieldora-renewer-trust',
            'fieldora-issuer-authority',
            'issuer-private.pem',
            'pg_reload_conf()',
            'Running live no-restart certificate renewal test'
          )
          foreach ($needle in $required) {
            if (-not $text.Contains($needle)) {
              throw "Installer trust contract is missing: $needle"
            }
          }
          if ($text.Contains('--allow-insecure-http')) {
            throw 'Clean installer must not enable insecure HTTP.'
          }
          Write-Host "Service enrollment, HTTPS, mTLS and live renewal contract: OK"

      - name: Certify automatic bootstrap credential handoff
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath ./Install-Fieldora-Clean-Windows.ps1 -Raw
          foreach ($needle in @(
            '[ValidateRange(1,90)][int]$CredentialHandoffRetentionDays = 7',
            'Install-Fieldora-Bootstrap-Handoff.ps1',
            '-RetentionDays $CredentialHandoffRetentionDays',
            'bootstrap-handoff\\ADMIN-CREDENTIALS.txt',
            'Credential handoff retention:'
          )) {
            if (-not $text.Contains($needle)) {
              throw "Windows clean install does not automatically configure expiring credential handoff: $needle"
            }
          }
          Write-Host "Automatic temporary administrator credential handoff: OK"

      - name: Certify Windows CurrentUser root trust
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath ./Install-Fieldora-Clean-Windows.ps1 -Raw
          foreach ($needle in @(
            'X509Store',
            'StoreName]::Root',
            'StoreLocation]::CurrentUser',
            'CreateFromPemFile',
            'Thumbprint',
            'Windows CurrentUser Fieldora CA trust: VERIFIED',
            '--ssl-revoke-best-effort'
          )) {
            if (-not $text.Contains($needle)) {
              throw "Windows trust wrapper is missing: $needle"
            }
          }
          if ($text.Contains('--cacert') -or $text.Contains('--insecure')) {
            throw 'Final Windows browser-trust probe must use the OS trust store, not bypass or explicit CA arguments.'
          }
          Write-Host "Windows CurrentUser root trust contract: OK"

      - name: Certify Windows curl handling
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath ./Install-Fieldora-Clean.ps1 -Raw
          if ($text.Contains('-o $null')) {
            throw 'curl.exe -o $null drops the native argument in PowerShell; use -o NUL.'
          }
          if (-not $text.Contains('-o NUL')) {
            throw 'Windows curl smoke tests must discard bodies with -o NUL.'
          }
          if (-not $text.Contains('--ssl-revoke-best-effort')) {
            throw 'Windows Schannel private-CA smoke tests must use best-effort revocation while retaining certificate validation.'
          }
          if ($text.Contains('--insecure') -or $text.Contains('-k ')) {
            throw 'Installer TLS smoke tests must never disable certificate verification.'
          }
          Write-Host "Windows curl private-CA handling: OK"

      - name: Certify clean runtime stability
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath ./Install-Fieldora-Clean.ps1 -Raw
          foreach ($needle in @(
            '{{.RestartCount}}',
            'restarted $restartCount time(s) during clean installation',
            "expected 'active'"
          )) {
            if (-not $text.Contains($needle)) {
              throw "Installer does not certify clean runtime stability: $needle"
            }
          }
          Write-Host "Zero-restart and active-service certification: OK"

      - name: Ensure root CA is not mounted into running renewal service
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath ./Install-Fieldora-Clean.ps1 -Raw
          if (-not $text.Contains('Root CA private key: offline from running containers')) {
            throw 'Installer does not certify offline root-key separation.'
          }
          $renewerStart = $text.IndexOf('fieldora-cert-renewer:')
          $volumesStart = $text.IndexOf("`nvolumes:", $renewerStart)
          if ($renewerStart -lt 0 -or $volumesStart -lt 0) {
            throw 'Cannot locate renewal-service Compose section.'
          }
          $renewerSection = $text.Substring($renewerStart, $volumesStart - $renewerStart)
          if ($renewerSection.Contains('./service-trust:')) {
            throw 'Renewal service must not mount the offline root CA directory.'
          }
          if (-not $renewerSection.Contains('fieldora-issuer-authority:/run/fieldora-authority:ro')) {
            throw 'Renewal service must use the constrained issuer volume.'
          }
          Write-Host "Offline root / constrained online issuer separation: OK"

      - name: Ensure plaintext PostgreSQL network access is rejected
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath ./Install-Fieldora-Clean.ps1 -Raw
          foreach ($needle in @(
            'hostnossl all all   0.0.0.0/0   reject',
            'hostnossl all all   ::/0        reject'
          )) {
            if (-not $text.Contains($needle)) {
              throw "PostgreSQL plaintext rejection rule is missing: $needle"
            }
          }
          Write-Host "PostgreSQL plaintext rejection: OK"
