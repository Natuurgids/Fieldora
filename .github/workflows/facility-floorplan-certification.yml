name: Facility floorplan certification

on:
  pull_request:
    paths:
      - "src/natureai_next/application/facility_*.py"
      - "src/natureai_next/application/operations_assets.py"
      - "src/natureai_next/server/facility_*.py"
      - "src/natureai_next/ui/qt/facility_*.py"
      - "src/natureai_next/ui/qt/navigation_contracts.py"
      - "tests/test_facility_*.py"
      - "tests/test_versioned_facility_floorplans.py"
      - ".github/workflows/facility-floorplan-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facility-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      FIELDORA_IDENTITY_ID: local-user
      FIELDORA_PROFILE_ROLE: administrator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install focused certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,gui]"

      - name: Ruff strict facility modules
        run: >-
          python -m ruff check
          src/natureai_next/application/facility_library.py
          src/natureai_next/application/facility_mobile.py
          src/natureai_next/application/facility_planning.py
          src/natureai_next/server/facility_api.py
          src/natureai_next/server/facility_composition.py
          src/natureai_next/ui/qt/facility_floorplan.py
          src/natureai_next/ui/qt/facility_operations_integration.py
          src/natureai_next/ui/qt/navigation_contracts.py
          tests/test_facility_floorplan_contract.py
          tests/test_facility_floorplan_module.py
          tests/test_facility_library_bridge.py
          tests/test_facility_mobile_contract.py
          tests/test_facility_planning_workflow.py
          tests/test_facility_server_api.py
          tests/test_facility_server_composition.py
          tests/test_facility_v5_integration.py
          tests/test_versioned_facility_floorplans.py

      - name: Ruff shared Operations service
        run: python -m ruff check --ignore UP035 src/natureai_next/application/operations_assets.py

      - name: Ruff planning UI pending import-only cleanup
        run: python -m ruff check --ignore I001,F401 src/natureai_next/ui/qt/facility_planning.py

      - name: Facility unit and migration tests
        run: >-
          python -m pytest -q
          tests/test_facility_floorplan_contract.py
          tests/test_facility_floorplan_module.py
          tests/test_facility_library_bridge.py
          tests/test_facility_mobile_contract.py
          tests/test_facility_planning_workflow.py
          tests/test_facility_server_api.py
          tests/test_facility_server_composition.py
          tests/test_facility_v5_integration.py
          tests/test_versioned_facility_floorplans.py
