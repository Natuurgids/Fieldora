name: Fieldora full tests and Qt certification

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/fieldora-full-tests.yml"
      - ".github/workflows/facility-floorplan-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-tests-and-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      FIELDORA_IDENTITY_ID: local-user
      FIELDORA_PROFILE_ROLE: administrator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,gui]"

      - name: Full unit and migration suite
        run: python -m pytest -q

      - name: Offscreen Qt V5 facility integration smoke
        run: >-
          python -c "from natureai_next.ui.qt.facility_floorplan import FacilityFloorplanDialog;
          from natureai_next.ui.qt.facility_planning import FacilityPlanningWorkspace;
          from natureai_next.ui.qt.facility_operations_integration import integrate_asset_equipment_operations;
          from natureai_next.ui.qt.v5_desktop import AssetEquipmentOperations;
          print('Qt facility integration imports OK')"
