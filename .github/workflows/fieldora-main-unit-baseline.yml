name: Fieldora main unit baseline

on:
  pull_request:
    paths:
      - ".github/workflows/fieldora-main-unit-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-unit-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out main baseline
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,gui]"
      - name: Main unit and non-migration tests
        run: python -m pytest -q -m "not migration"
