name: Fieldora Qt certification

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/fieldora-qt-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      FIELDORA_IDENTITY_ID: local-user
      FIELDORA_PROFILE_ROLE: administrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,gui]"
      - name: Offscreen Qt V5 facility integration smoke
        run: >-
          python -c "from PySide6.QtWidgets import QApplication;
          from natureai_next.ui.qt.facility_floorplan import FacilityFloorplanDialog;
          from natureai_next.ui.qt.facility_planning import FacilityPlanningWorkspace;
          from natureai_next.ui.qt.facility_operations_integration import integrate_asset_equipment_operations;
          from natureai_next.ui.qt.v5_desktop import AssetEquipmentOperations;
          app = QApplication.instance() or QApplication([]);
          print('Qt facility integration imports and QApplication OK')"
