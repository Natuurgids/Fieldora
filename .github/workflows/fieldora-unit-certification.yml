name: Fieldora unit certification

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/fieldora-unit-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      FIELDORA_IDENTITY_ID: local-user
      FIELDORA_PROFILE_ROLE: administrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,gui]"
      - name: Unit and non-migration tests
        run: python -m pytest -q -m "not migration"
