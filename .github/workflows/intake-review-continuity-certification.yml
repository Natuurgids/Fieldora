name: Fieldora intake review continuity certification

on:
  push:
    branches: [main]
    paths:
      - 'src/natureai_next/server/intake_review_web.py'
      - 'src/natureai_next/server/desktop_alignment_web.py'
      - 'src/natureai_next/server/administration_workspace_web.py'
      - 'tests/test_intake_review_web_continuity.py'
      - '.github/workflows/intake-review-continuity-certification.yml'
  pull_request:
    paths:
      - 'src/natureai_next/server/intake_review_web.py'
      - 'src/natureai_next/server/desktop_alignment_web.py'
      - 'src/natureai_next/server/linked_storage_browser_api.py'
      - 'src/natureai_next/server/web_compatibility.py'
      - 'src/natureai_next/server/platform_api.py'
      - 'tests/test_intake_review_web_continuity.py'
      - '.github/workflows/intake-review-continuity-certification.yml'
  workflow_dispatch:

jobs:
  intake-review-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact workflow head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff intake review continuity boundary
        run: >-
          python -m ruff check
          src/natureai_next/server/intake_review_web.py
          src/natureai_next/server/desktop_alignment_web.py
          src/natureai_next/server/administration_workspace_web.py
          src/natureai_next/server/linked_storage_browser_api.py
          tests/test_intake_review_web_continuity.py
      - name: Intake review continuity
        run: python -m pytest -q tests/test_intake_review_web_continuity.py
