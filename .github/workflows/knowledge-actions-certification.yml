name: Fieldora knowledge actions certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/knowledge_parity_api.py"
      - "src/natureai_next/server/knowledge_review_web.py"
      - "src/natureai_next/server/visible_control_audit_web.py"
      - "tests/test_web037_knowledge_workflow_web.py"
      - "tests/test_web043_knowledge_actions_web.py"
      - ".github/workflows/knowledge-actions-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knowledge-actions-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install browser engines
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Ruff WEB-043 Knowledge actions
        run: >-
          python -m ruff check
          src/natureai_next/server/knowledge_review_web.py
          tests/test_web037_knowledge_workflow_web.py
          tests/test_web043_knowledge_actions_web.py

      - name: WEB-037 governed Knowledge regression
        run: pytest -q tests/test_web037_knowledge_workflow_web.py

      - name: WEB-043 three-browser Knowledge actions
        run: pytest -q tests/test_web043_knowledge_actions_web.py

      - name: WEB-040 final visible-control regression
        run: pytest -q tests/test_web040_visible_control_audit.py
