name: Fieldora Kubernetes IaC baseline certification

on:
  pull_request:
    paths:
      - "deployment/kubernetes/**"
      - "tests/test_kubernetes_iac_baseline.py"
      - ".github/workflows/kubernetes-iac-baseline-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kubernetes-iac-baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused certification dependencies
        run: python -m pip install "pytest>=8.3,<9" "ruff>=0.7,<1"

      - name: Ruff IaC contract test
        run: python -m ruff check tests/test_kubernetes_iac_baseline.py

      - name: Kubernetes IaC baseline tests
        run: pytest -q tests/test_kubernetes_iac_baseline.py
