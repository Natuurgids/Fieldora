name: Fieldora linked preview byte certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/linked_storage_api.py"
      - "src/natureai_next/server/postgres_linked_preview.py"
      - "src/natureai_next/server/postgres_linked_preview_store.py"
      - "src/natureai_next/server/postgres_linked_storage.py"
      - "src/natureai_next/server/storage_service_api.py"
      - "src/natureai_next/server/storage_service_agent.py"
      - "src/natureai_next/server/storage_service_runtime.py"
      - "tests/test_linked_storage_api.py"
      - "tests/test_postgres_linked_preview.py"
      - "tests/test_postgres_linked_storage_lifecycle.py"
      - "tests/test_storage_service_api.py"
      - "tests/test_storage_service_agent.py"
      - ".github/workflows/linked-preview-byte-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linked-preview-byte-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fieldora_preview_test
          POSTGRES_USER: fieldora_test
          POSTGRES_PASSWORD: fieldora_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldora_test -d fieldora_preview_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FIELDORA_TEST_POSTGRES_DSN: >-
        postgresql://fieldora_test:fieldora_test_password@127.0.0.1:5432/fieldora_preview_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,server-postgresql]"

      - name: Ruff linked preview data plane
        run: >-
          python -m ruff check
          src/natureai_next/server/linked_storage_api.py
          src/natureai_next/server/postgres_linked_preview.py
          src/natureai_next/server/postgres_linked_preview_store.py
          src/natureai_next/server/postgres_linked_storage.py
          src/natureai_next/server/storage_service_api.py
          src/natureai_next/server/storage_service_agent.py
          src/natureai_next/server/storage_service_runtime.py
          tests/test_linked_storage_api.py
          tests/test_postgres_linked_preview.py
          tests/test_postgres_linked_storage_lifecycle.py
          tests/test_storage_service_api.py
          tests/test_storage_service_agent.py

      - name: Bandit linked preview data plane
        run: >-
          python -m bandit
          src/natureai_next/server/linked_storage_api.py
          src/natureai_next/server/postgres_linked_preview.py
          src/natureai_next/server/postgres_linked_preview_store.py
          src/natureai_next/server/postgres_linked_storage.py
          src/natureai_next/server/storage_service_api.py
          src/natureai_next/server/storage_service_agent.py
          src/natureai_next/server/storage_service_runtime.py
          -c pyproject.toml -ll -ii

      - name: Semgrep OWASP linked preview data plane
        run: >-
          semgrep scan --config p/owasp-top-ten --metrics off
          --severity ERROR --error
          src/natureai_next/server/linked_storage_api.py
          src/natureai_next/server/postgres_linked_preview.py
          src/natureai_next/server/postgres_linked_preview_store.py
          src/natureai_next/server/postgres_linked_storage.py
          src/natureai_next/server/storage_service_api.py
          src/natureai_next/server/storage_service_agent.py
          src/natureai_next/server/storage_service_runtime.py

      - name: Linked preview integration and boundary tests
        run: >-
          python -m pytest -q
          tests/test_linked_storage_api.py
          tests/test_postgres_linked_preview.py
          tests/test_postgres_linked_storage_lifecycle.py
          tests/test_storage_service_api.py
          tests/test_storage_service_agent.py
