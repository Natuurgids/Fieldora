name: Fieldora linked archive setup certification

on:
  pull_request:
    paths:
      - 'src/natureai_next/server/linked_storage_operator_web.py'
      - 'src/natureai_next/server/platform_api.py'
      - 'src/natureai_next/server/storage_service_api.py'
      - 'src/natureai_next/server/storage_service_agent.py'
      - 'tests/test_linked_storage_operator_setup_web.py'
      - '.github/workflows/linked-storage-setup-certification.yml'
  workflow_dispatch:

jobs:
  linked-storage-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff linked archive setup boundary
        run: >-
          python -m ruff check
          src/natureai_next/server/linked_storage_operator_web.py
          tests/test_linked_storage_operator_setup_web.py
      - name: Linked archive setup contract
        run: python -m pytest -q tests/test_linked_storage_operator_setup_web.py
