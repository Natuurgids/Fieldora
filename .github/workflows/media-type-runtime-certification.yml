name: Media type runtime certification

on:
  pull_request:
  workflow_dispatch:

jobs:
  certify-media-type-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - name: Certify all ingestion contracts
        run: >-
          python -m pytest -q
          tests/test_media_types.py
          tests/test_media_type_api.py
          tests/test_linked_media_mime_convergence.py
          tests/test_media_type_runtime_ownership.py
          tests/test_media_type_browser_contract.py
          tests/test_media_type_staged_contract.py
