name: Fieldora modular shell certification

on:
  pull_request:
    paths:
      - "src/natureai_next/application/project_task_detail.py"
      - "src/natureai_next/server/web_module_contracts.py"
      - "src/natureai_next/server/web_module_runtime.py"
      - "src/natureai_next/server/modular_shell_web.py"
      - "src/natureai_next/server/capacity_module_web.py"
      - "src/natureai_next/server/project_capacity_integration_web.py"
      - "src/natureai_next/server/project_core_module_web.py"
      - "src/natureai_next/server/project_creation_module_web.py"
      - "src/natureai_next/server/project_evidence_actions_module_web.py"
      - "src/natureai_next/server/project_progress_module_web.py"
      - "src/natureai_next/server/project_research_integration_web.py"
      - "src/natureai_next/server/project_task_edit_module_web.py"
      - "src/natureai_next/server/project_task_editing.py"
      - "src/natureai_next/server/project_work_actions_module_web.py"
      - "src/natureai_next/server/project_lifecycle_module_web.py"
      - "src/natureai_next/server/project_runtime_web.py"
      - "src/natureai_next/server/portfolio_module_web.py"
      - "src/natureai_next/server/project_facility_workspace_web.py"
      - "src/natureai_next/server/research_records_web.py"
      - "src/natureai_next/server/offline_first_api.py"
      - "src/natureai_next/server/http.py"
      - "tests/test_web_module_contracts.py"
      - "tests/test_web_module_runtime.py"
      - "tests/test_modular_shell_web.py"
      - "tests/test_project_capacity_integration_web.py"
      - "tests/test_project_core_module_web.py"
      - "tests/test_project_creation_module_web.py"
      - "tests/test_project_evidence_actions_module_web.py"
      - "tests/test_project_progress_module_web.py"
      - "tests/test_project_research_integration_web.py"
      - "tests/test_project_task_detail.py"
      - "tests/test_project_task_edit_module_web.py"
      - "tests/test_project_task_editing.py"
      - "tests/test_project_work_actions_module_web.py"
      - "tests/test_project_lifecycle_module_web.py"
      - "tests/test_portfolio_module_web.py"
      - ".github/workflows/modular-shell-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modular-shell-certification:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff module contracts and runtime
        run: >-
          python -m ruff check
          src/natureai_next/server/web_module_contracts.py
          src/natureai_next/server/web_module_runtime.py
      - name: Ruff shell and feature adapters
        run: >-
          python -m ruff check
          src/natureai_next/application/project_task_detail.py
          src/natureai_next/server/modular_shell_web.py
          src/natureai_next/server/capacity_module_web.py
          src/natureai_next/server/project_capacity_integration_web.py
          src/natureai_next/server/project_core_module_web.py
          src/natureai_next/server/project_creation_module_web.py
          src/natureai_next/server/project_evidence_actions_module_web.py
          src/natureai_next/server/project_progress_module_web.py
          src/natureai_next/server/project_research_integration_web.py
          src/natureai_next/server/project_task_edit_module_web.py
          src/natureai_next/server/project_task_editing.py
          src/natureai_next/server/project_work_actions_module_web.py
          src/natureai_next/server/project_lifecycle_module_web.py
          src/natureai_next/server/portfolio_module_web.py
          src/natureai_next/server/research_records_web.py
          src/natureai_next/server/offline_first_api.py
          src/natureai_next/server/http.py
      - name: Ruff modular shell tests
        run: >-
          python -m ruff check
          tests/test_web_module_contracts.py
          tests/test_web_module_runtime.py
          tests/test_modular_shell_web.py
          tests/test_project_capacity_integration_web.py
          tests/test_project_core_module_web.py
          tests/test_project_creation_module_web.py
          tests/test_project_evidence_actions_module_web.py
          tests/test_project_progress_module_web.py
          tests/test_project_research_integration_web.py
          tests/test_project_task_detail.py
          tests/test_project_task_edit_module_web.py
          tests/test_project_task_editing.py
          tests/test_project_work_actions_module_web.py
          tests/test_project_lifecycle_module_web.py
          tests/test_portfolio_module_web.py
      - name: Modular shell contract tests
        run: >-
          pytest -q
          tests/test_web_module_contracts.py
          tests/test_web_module_runtime.py
          tests/test_modular_shell_web.py
          tests/test_project_capacity_integration_web.py
          tests/test_project_core_module_web.py
          tests/test_project_creation_module_web.py
          tests/test_project_evidence_actions_module_web.py
          tests/test_project_progress_module_web.py
          tests/test_project_research_integration_web.py
          tests/test_project_task_detail.py
          tests/test_project_task_edit_module_web.py
          tests/test_project_task_editing.py
          tests/test_project_work_actions_module_web.py
          tests/test_project_lifecycle_module_web.py
          tests/test_portfolio_module_web.py
