name: Native container identity security

on:
  pull_request:
    paths:
      - "scripts/verify_container_identity.py"
      - "tests/test_container_identity_security.py"
      - ".github/workflows/native-container-identity-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-container-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify pull request head checkout
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Certify immutable identity verifier
        run: python -m pytest -q tests/test_container_identity_security.py
      - name: Build, publish, deploy and inspect immutable OCI identity
        shell: bash
        run: |
          set -euo pipefail
          git_commit="$(git rev-parse HEAD)"
          image="localhost:5000/fieldora-identity:${git_commit}"
          repository="localhost:5000/fieldora-identity"

          docker run -d --name fieldora-identity-registry -p 5000:5000 registry:2
          cat > /tmp/Fieldora.identity.Dockerfile <<'EOF'
          FROM alpine:3.20
          ARG FIELDORA_GIT_COMMIT
          LABEL org.opencontainers.image.revision=$FIELDORA_GIT_COMMIT
          CMD ["sh", "-c", "while true; do sleep 60; done"]
          EOF
          docker build \
            --file /tmp/Fieldora.identity.Dockerfile \
            --build-arg "FIELDORA_GIT_COMMIT=${git_commit}" \
            --tag "${image}" \
            .
          docker push "${image}"

          built_ref="$(docker image inspect "${image}" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep "^${repository}@sha256:" | head -n1)"
          built_digest="${built_ref##*@}"
          test "${built_digest}" != "${built_ref}"

          deployed_ref="${repository}@${built_digest}"
          docker pull "${deployed_ref}"
          docker run -d --name fieldora-identity-runtime "${deployed_ref}"
          configured_ref="$(docker inspect --format '{{.Config.Image}}' fieldora-identity-runtime)"
          test "${configured_ref}" = "${deployed_ref}"

          running_image_id="$(docker inspect --format '{{.Image}}' fieldora-identity-runtime)"
          running_ref="$(docker image inspect "${running_image_id}" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep "^${repository}@sha256:" | head -n1)"
          running_digest="${running_ref##*@}"
          test "${running_digest}" != "${running_ref}"

          export FIELDORA_GIT_COMMIT="${git_commit}"
          export FIELDORA_BUILT_DIGEST="${built_digest}"
          export FIELDORA_DEPLOYED_DIGEST="${built_digest}"
          export FIELDORA_RUNNING_DIGEST="${running_digest}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.verify_container_identity import certification_proof_digest

          evidence = {
              "git_commit": os.environ["FIELDORA_GIT_COMMIT"],
              "build_input_commit": os.environ["FIELDORA_GIT_COMMIT"],
              "built_image_digest": os.environ["FIELDORA_BUILT_DIGEST"],
              "deployed_image_digest": os.environ["FIELDORA_DEPLOYED_DIGEST"],
              "running_image_digest": os.environ["FIELDORA_RUNNING_DIGEST"],
          }
          evidence["certification_proof_digest"] = certification_proof_digest(evidence)
          Path("container-identity-evidence.json").write_text(
              json.dumps(evidence, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python scripts/verify_container_identity.py container-identity-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: container-identity-evidence
          path: container-identity-evidence.json
          if-no-files-found: error
