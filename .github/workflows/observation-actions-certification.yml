name: Fieldora observation actions certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/observation_actions_api.py"
      - "src/natureai_next/server/observation_actions_web.py"
      - "src/natureai_next/server/observation_parity_api.py"
      - "src/natureai_next/server/science_workflow_web.py"
      - "src/natureai_next/server/visible_control_audit_web.py"
      - "src/natureai_next/server/offline_first_api.py"
      - "tests/test_web041_observation_actions.py"
      - "tests/test_web035_observation_parity_api.py"
      - "tests/test_web036_observation_evidence_links.py"
      - ".github/workflows/observation-actions-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation-actions-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install browser engines
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Ruff WEB-041 Observation action seam
        run: >-
          python -m ruff check
          src/natureai_next/server/observation_actions_api.py
          src/natureai_next/server/observation_actions_web.py
          src/natureai_next/server/offline_first_api.py
          tests/test_web041_observation_actions.py

      - name: WEB-041 three-browser Observation actions
        run: pytest -q tests/test_web041_observation_actions.py

      - name: Governed Observation API regression
        run: >-
          pytest -q
          tests/test_web035_observation_parity_api.py
          tests/test_web036_observation_evidence_links.py
