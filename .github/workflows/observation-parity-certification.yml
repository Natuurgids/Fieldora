name: Fieldora observation parity certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/observation_parity_api.py"
      - "src/natureai_next/server/offline_first_api.py"
      - "src/natureai_next/server/science_workflow_web.py"
      - "tests/test_web035_observation_parity_api.py"
      - "tests/test_web035_observation_workflow_web.py"
      - "tests/test_web036_observation_evidence_links.py"
      - "tests/test_desktop_alignment_web.py"
      - ".github/workflows/observation-parity-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation-parity-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install browser engines
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Ruff WEB-035 and WEB-036 observation parity seam
        run: >-
          python -m ruff check
          src/natureai_next/server/observation_parity_api.py
          src/natureai_next/server/offline_first_api.py
          src/natureai_next/server/science_workflow_web.py
          tests/test_web035_observation_parity_api.py
          tests/test_web035_observation_workflow_web.py
          tests/test_web036_observation_evidence_links.py
          tests/test_desktop_alignment_web.py

      - name: WEB-035 and WEB-036 contract and browser parity tests
        run: >-
          python -m pytest -q
          tests/test_web035_observation_parity_api.py
          tests/test_web035_observation_workflow_web.py
          tests/test_web036_observation_evidence_links.py
          tests/test_desktop_alignment_web.py
