name: Fieldora offline maps service certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/offline_maps_web.py"
      - "src/natureai_next/server/facility_module_composition.py"
      - "src/natureai_next/server/web_module_extensions.py"
      - "tests/test_route_less_module_contract_runtime.py"
      - ".github/workflows/offline-maps-service-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-maps-service-certification:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff Offline Maps service boundary
        run: >-
          python -m ruff check
          src/natureai_next/server/offline_maps_web.py
          src/natureai_next/server/facility_module_composition.py
          src/natureai_next/server/web_module_extensions.py
          tests/test_route_less_module_contract_runtime.py
      - name: Offline Maps service contract regression
        run: pytest -q tests/test_route_less_module_contract_runtime.py
