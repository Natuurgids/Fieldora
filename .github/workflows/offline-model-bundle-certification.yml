name: Fieldora offline model bundle certification

on:
  pull_request:
    paths:
      - "src/natureai_next/bootstrap/model_bundle_cli.py"
      - "tests/test_model_bundle_cli.py"
      - "pyproject.toml"
      - ".github/workflows/offline-model-bundle-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-model-bundle-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff offline model bundle path
        run: >-
          python -m ruff check
          src/natureai_next/bootstrap/model_bundle_cli.py
          tests/test_model_bundle_cli.py
      - name: Offline model bundle security and installation tests
        run: python -m pytest -q tests/test_model_bundle_cli.py
      - name: Certify installed CLI contract
        run: |
          fieldora-model-bundle --help >/dev/null
          fieldora-model-bundle verify --help >/dev/null
          fieldora-model-bundle install --help >/dev/null
      - name: Certify no executable model formats are accepted
        run: |
          python - <<'PY'
          from natureai_next.bootstrap import model_bundle_cli as m
          forbidden = {'.py', '.pkl', '.pickle', '.pt', '.pth', '.bin', '.sh', '.ps1', '.exe'}
          missing = forbidden - m._FORBIDDEN_EXTENSIONS
          if missing:
              raise SystemExit(f"missing forbidden model extensions: {sorted(missing)}")
          if not {'.safetensors', '.onnx', '.gguf'} <= m._MODEL_EXTENSIONS:
              raise SystemExit('safe model artifact allowlist is incomplete')
          PY
