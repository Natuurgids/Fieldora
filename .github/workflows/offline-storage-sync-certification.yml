name: Fieldora offline storage and sync certification

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/natureai_next/bootstrap/platform_server_cli.py"
      - "src/natureai_next/bootstrap/storage_service_cli.py"
      - "src/natureai_next/domain/synchronization.py"
      - "src/natureai_next/server/offline_first_api.py"
      - "src/natureai_next/server/offline_sync.py"
      - "src/natureai_next/server/offline_sync_api.py"
      - "src/natureai_next/server/postgres_offline_sync.py"
      - "src/natureai_next/server/linked_storage.py"
      - "src/natureai_next/server/linked_storage_api.py"
      - "src/natureai_next/server/postgres_linked_storage.py"
      - "src/natureai_next/server/postgres_linked_preview.py"
      - "src/natureai_next/server/storage_exchange.py"
      - "src/natureai_next/server/service_http.py"
      - "src/natureai_next/server/storage_service_api.py"
      - "src/natureai_next/server/storage_service_agent.py"
      - "src/natureai_next/server/storage_service_runtime.py"
      - "tests/test_offline_first_composition.py"
      - "tests/test_offline_sync.py"
      - "tests/test_offline_sync_api.py"
      - "tests/test_postgres_offline_sync.py"
      - "tests/test_linked_storage.py"
      - "tests/test_linked_storage_api.py"
      - "tests/test_postgres_linked_storage.py"
      - "tests/test_postgres_linked_preview.py"
      - "tests/test_storage_exchange.py"
      - "tests/test_service_http.py"
      - "tests/test_storage_service_api.py"
      - "tests/test_storage_service_agent.py"
      - "tests/test_storage_service_runtime.py"
      - ".github/workflows/offline-storage-sync-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-storage-sync-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fieldora_sync_test
          POSTGRES_USER: fieldora_test
          POSTGRES_PASSWORD: fieldora_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldora_test -d fieldora_sync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FIELDORA_TEST_POSTGRES_DSN: >-
        postgresql://fieldora_test:fieldora_test_password@127.0.0.1:5432/fieldora_sync_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,server-postgresql]"

      - name: Ruff offline storage and synchronization
        shell: bash
        run: |
          python -m ruff check \
            src/natureai_next/bootstrap/platform_server_cli.py \
            src/natureai_next/bootstrap/storage_service_cli.py \
            src/natureai_next/domain/synchronization.py \
            src/natureai_next/server/offline_first_api.py \
            src/natureai_next/server/offline_sync.py \
            src/natureai_next/server/offline_sync_api.py \
            src/natureai_next/server/postgres_offline_sync.py \
            src/natureai_next/server/linked_storage_api.py \
            src/natureai_next/server/postgres_linked_storage.py \
            src/natureai_next/server/postgres_linked_preview.py \
            src/natureai_next/server/storage_exchange.py \
            src/natureai_next/server/service_http.py \
            src/natureai_next/server/storage_service_api.py \
            src/natureai_next/server/storage_service_agent.py \
            src/natureai_next/server/storage_service_runtime.py \
            tests/test_offline_first_composition.py \
            tests/test_offline_sync.py \
            tests/test_offline_sync_api.py \
            tests/test_postgres_offline_sync.py \
            tests/test_linked_storage.py \
            tests/test_linked_storage_api.py \
            tests/test_postgres_linked_storage.py \
            tests/test_postgres_linked_preview.py \
            tests/test_storage_exchange.py \
            tests/test_service_http.py \
            tests/test_storage_service_api.py \
            tests/test_storage_service_agent.py \
            tests/test_storage_service_runtime.py
          python -m ruff check --ignore UP035 src/natureai_next/server/linked_storage.py

      - name: Bandit offline storage and synchronization gate
        run: >-
          python -m bandit
          src/natureai_next/bootstrap/platform_server_cli.py
          src/natureai_next/bootstrap/storage_service_cli.py
          src/natureai_next/server/offline_first_api.py
          src/natureai_next/server/offline_sync.py
          src/natureai_next/server/offline_sync_api.py
          src/natureai_next/server/postgres_offline_sync.py
          src/natureai_next/server/linked_storage.py
          src/natureai_next/server/linked_storage_api.py
          src/natureai_next/server/postgres_linked_storage.py
          src/natureai_next/server/postgres_linked_preview.py
          src/natureai_next/server/storage_exchange.py
          src/natureai_next/server/service_http.py
          src/natureai_next/server/storage_service_api.py
          src/natureai_next/server/storage_service_agent.py
          src/natureai_next/server/storage_service_runtime.py
          -c pyproject.toml -ll -ii

      - name: Semgrep OWASP offline storage and synchronization gate
        run: >-
          semgrep scan --config p/owasp-top-ten --metrics off
          --severity ERROR --error
          src/natureai_next/bootstrap/platform_server_cli.py
          src/natureai_next/bootstrap/storage_service_cli.py
          src/natureai_next/server/offline_first_api.py
          src/natureai_next/server/offline_sync.py
          src/natureai_next/server/offline_sync_api.py
          src/natureai_next/server/postgres_offline_sync.py
          src/natureai_next/server/linked_storage.py
          src/natureai_next/server/linked_storage_api.py
          src/natureai_next/server/postgres_linked_storage.py
          src/natureai_next/server/postgres_linked_preview.py
          src/natureai_next/server/storage_exchange.py
          src/natureai_next/server/service_http.py
          src/natureai_next/server/storage_service_api.py
          src/natureai_next/server/storage_service_agent.py
          src/natureai_next/server/storage_service_runtime.py

      - name: Offline storage and synchronization tests
        run: >-
          python -m pytest -q
          tests/test_offline_first_composition.py
          tests/test_offline_sync.py
          tests/test_offline_sync_api.py
          tests/test_postgres_offline_sync.py
          tests/test_linked_storage.py
          tests/test_linked_storage_api.py
          tests/test_postgres_linked_storage.py
          tests/test_postgres_linked_preview.py
          tests/test_storage_exchange.py
          tests/test_service_http.py
          tests/test_storage_service_api.py
          tests/test_storage_service_agent.py
          tests/test_storage_service_runtime.py
