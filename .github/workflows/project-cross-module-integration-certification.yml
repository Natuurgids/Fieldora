name: Fieldora Project cross-module integration certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/capacity_module_web.py"
      - "src/natureai_next/server/project_capacity_integration_web.py"
      - "src/natureai_next/server/project_context_provider_web.py"
      - "src/natureai_next/server/project_core_module_web.py"
      - "src/natureai_next/server/project_research_integration_web.py"
      - "src/natureai_next/server/research_records_web.py"
      - "src/natureai_next/server/web_module_contracts.py"
      - "tests/test_project_capacity_integration_web.py"
      - "tests/test_project_context_provider_web.py"
      - "tests/test_project_cross_module_integration_browser.py"
      - "tests/test_project_research_integration_web.py"
      - ".github/workflows/project-cross-module-integration-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-cross-module-integration-certification:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install Chromium certification engine
        run: python -m playwright install --with-deps chromium

      - name: Ruff Project cross-module boundaries
        run: >-
          python -m ruff check
          src/natureai_next/server/capacity_module_web.py
          src/natureai_next/server/project_capacity_integration_web.py
          src/natureai_next/server/project_context_provider_web.py
          src/natureai_next/server/project_core_module_web.py
          src/natureai_next/server/project_research_integration_web.py
          src/natureai_next/server/research_records_web.py
          tests/test_project_capacity_integration_web.py
          tests/test_project_context_provider_web.py
          tests/test_project_cross_module_integration_browser.py
          tests/test_project_research_integration_web.py

      - name: Project cross-module final-DOM tests
        run: >-
          pytest -q
          tests/test_project_capacity_integration_web.py
          tests/test_project_context_provider_web.py
          tests/test_project_cross_module_integration_browser.py
          tests/test_project_research_integration_web.py
