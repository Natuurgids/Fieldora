name: Fieldora project parity certification

on:
  pull_request:
    paths:
      - "src/natureai_next/application/project_management.py"
      - "src/natureai_next/server/postgres_project_management.py"
      - "src/natureai_next/server/browser_functionality_api.py"
      - "src/natureai_next/bootstrap/platform_server_cli.py"
      - "tests/test_postgres_project_management.py"
      - "tests/test_browser_project_management_api.py"
      - ".github/workflows/project-parity-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-parity-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fieldora_project_test
          POSTGRES_USER: fieldora_test
          POSTGRES_PASSWORD: fieldora_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldora_test -d fieldora_project_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FIELDORA_TEST_POSTGRES_DSN: >-
        postgresql://fieldora_test:fieldora_test_password@127.0.0.1:5432/fieldora_project_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,server-postgresql]"

      - name: Ruff managed project parity
        run: >-
          python -m ruff check
          src/natureai_next/server/postgres_project_management.py
          src/natureai_next/server/browser_functionality_api.py
          src/natureai_next/bootstrap/platform_server_cli.py
          tests/test_postgres_project_management.py
          tests/test_browser_project_management_api.py

      - name: Managed project parity tests
        run: >-
          pytest -q
          tests/test_postgres_project_management.py
          tests/test_browser_project_management_api.py
