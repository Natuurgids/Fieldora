name: Fieldora research record actions certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/research_records_api.py"
      - "src/natureai_next/server/research_records_web.py"
      - "src/natureai_next/server/visible_control_audit_web.py"
      - "src/natureai_next/server/offline_first_api.py"
      - "tests/test_web042_research_records_api.py"
      - "tests/test_web042_research_records_web.py"
      - ".github/workflows/research-record-actions-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-record-actions-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install browser engines
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Ruff WEB-042 Research lifecycle
        run: >-
          python -m ruff check
          src/natureai_next/server/research_records_api.py
          src/natureai_next/server/research_records_web.py
          src/natureai_next/server/visible_control_audit_web.py
          src/natureai_next/server/offline_first_api.py
          tests/test_web042_research_records_api.py
          tests/test_web042_research_records_web.py

      - name: WEB-042 governed Research API
        run: pytest -q tests/test_web042_research_records_api.py

      - name: WEB-042 three-browser Research actions
        run: pytest -q tests/test_web042_research_records_web.py

      - name: WEB-040 final visible-control regression
        run: pytest -q tests/test_web040_visible_control_audit.py
