name: Fieldora secure acquisition web certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/secure_acquisition_web.py"
      - "src/natureai_next/server/security_monitoring.py"
      - "src/natureai_next/server/offline_maps_web.py"
      - "tests/test_secure_acquisition_web.py"
      - "tests/test_security_monitoring.py"
      - ".github/workflows/secure-acquisition-web-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-acquisition-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff secure acquisition boundary
        run: >-
          python -m ruff check
          src/natureai_next/server/secure_acquisition_web.py
          src/natureai_next/server/security_monitoring.py
          src/natureai_next/server/offline_maps_web.py
          tests/test_secure_acquisition_web.py
          tests/test_security_monitoring.py
      - name: Trusted-side secure acquisition tests
        run: python -m pytest -q tests/test_secure_acquisition_web.py tests/test_security_monitoring.py
      - name: Certify Bastion authority and integrity alert boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          web = Path("src/natureai_next/server/secure_acquisition_web.py").read_text()
          monitoring = Path("src/natureai_next/server/security_monitoring.py").read_text()
          for required in (
              "secure transfer broker",
              "collection requests",
              "delivery requests",
              "collector-verifying",
              "integrity-failed",
              "package_integrity_mismatch",
              "security monitoring host",
              "browser cannot mark content clean",
          ):
              if required not in web:
                  raise SystemExit(f"missing secure transfer-broker contract: {required}")
          for required in (
              "expected_sha256",
              "observed_sha256",
              "signing_key_id",
              "package_integrity_mismatch",
              "emit_security_event",
          ):
              if required not in monitoring:
                  raise SystemExit(f"missing security monitoring contract: {required}")
          for forbidden in ("mark-clean", "approve-scan", "quarantine-path", "/api/v1/bastion/approve"):
              if forbidden in web:
                  raise SystemExit(f"browser must not own Bastion trust decision: {forbidden}")
          PY
