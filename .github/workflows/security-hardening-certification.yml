name: Fieldora native security hardening certification

on:
  pull_request:
    paths:
      - "src/natureai_next/application/native_handoff.py"
      - "src/natureai_next/application/security_install.py"
      - "src/natureai_next/application/update_trust.py"
      - "src/natureai_next/application/updates.py"
      - "src/natureai_next/bootstrap/native_updater.py"
      - "src/natureai_next/bootstrap/paths.py"
      - "src/natureai_next/domain/security_install.py"
      - "src/natureai_next/infrastructure/subsystems/access_control.py"
      - "scripts/sign_native_update_index.py"
      - "tests/test_native_handoff_security.py"
      - "tests/test_native_update_authenticity.py"
      - "tests/test_native_updater_config_root.py"
      - "tests/test_native_updater_pbac_provisioning.py"
      - "tests/test_security_install_acceptance.py"
      - "tests/test_update_application_paths.py"
      - ".github/workflows/security-hardening-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-security-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Certify native update trust, PBAC, and config-root boundaries
        run: >-
          python -m pytest -q
          tests/test_native_update_authenticity.py
          tests/test_security_install_acceptance.py
          tests/test_native_updater_pbac_provisioning.py
          tests/test_native_handoff_security.py
          tests/test_native_updater_config_root.py
          tests/test_update_application_paths.py
