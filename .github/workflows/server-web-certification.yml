name: Fieldora server web certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/http.py"
      - "src/natureai_next/server/web_compatibility.py"
      - "src/natureai_next/resources/server_web/**"
      - "tests/test_server_web_compatibility.py"
      - ".github/workflows/server-web-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-web-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff server web compatibility
        run: >-
          python -m ruff check
          src/natureai_next/server/http.py
          src/natureai_next/server/web_compatibility.py
          tests/test_server_web_compatibility.py

      - name: Server web compatibility tests
        run: python -m pytest -q tests/test_server_web_compatibility.py
