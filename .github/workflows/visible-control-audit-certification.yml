name: Fieldora visible control audit certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/visible_control_audit_api.py"
      - "src/natureai_next/server/visible_control_audit_web.py"
      - "src/natureai_next/server/offline_first_api.py"
      - "tests/test_web040_visible_control_audit.py"
      - ".github/workflows/visible-control-audit-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visible-control-audit-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install browser engines
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Ruff WEB-040 control audit seam
        run: >-
          python -m ruff check
          src/natureai_next/server/visible_control_audit_api.py
          src/natureai_next/server/visible_control_audit_web.py
          src/natureai_next/server/offline_first_api.py
          tests/test_web040_visible_control_audit.py

      - name: WEB-040 focused three-browser control audit
        run: python -m pytest -q tests/test_web040_visible_control_audit.py

      - name: Desktop-alignment and governed-workflow regression
        run: >-
          python -m pytest -q
          tests/test_desktop_alignment_web.py
          tests/test_web035_observation_workflow_web.py
          tests/test_web037_knowledge_workflow_web.py
          tests/test_web038_library_collections_web.py
          tests/test_web039_original_derivative_web.py
