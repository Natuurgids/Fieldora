name: Fieldora Wazuh security monitoring certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/security_monitoring.py"
      - "tests/test_security_monitoring.py"
      - "deployment/security-monitoring/wazuh/**"
      - ".github/workflows/wazuh-security-monitoring-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wazuh-security-monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff Wazuh integration
        run: python -m ruff check src/natureai_next/server/security_monitoring.py tests/test_security_monitoring.py
      - name: Security monitoring tests
        run: python -m pytest -q tests/test_security_monitoring.py
      - name: Certify bounded Wazuh contract
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("src/natureai_next/server/security_monitoring.py").read_text()
          docs = Path("deployment/security-monitoring/wazuh/README.md").read_text()
          for required in ("WazuhJsonlSink", "json.dumps", "package_integrity_mismatch", "os.fsync"):
              if required not in source:
                  raise SystemExit(f"missing Wazuh sink contract: {required}")
          for required in ("<log_format>json</log_format>", "FieldoraBastion", "does not replace", "Do not embed Wazuh administrative credentials"):
              if required not in docs:
                  raise SystemExit(f"missing Wazuh deployment boundary: {required}")
          PY
