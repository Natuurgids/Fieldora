name: WEB-026 Project create regression certification

on:
  pull_request:
    paths:
      - 'src/natureai_next/resources/server_web/index.html'
      - 'src/natureai_next/resources/server_web/app.js'
      - 'src/natureai_next/server/browser_functionality_web.py'
      - 'tests/test_web026_project_create_regression.py'
      - '.github/workflows/web026-project-create-regression.yml'

permissions:
  contents: read

jobs:
  web026-project-create-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install certification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Ruff WEB-026 regression
        run: python -m ruff check tests/test_web026_project_create_regression.py
      - name: Reproduce and repair Project create action
        run: pytest -q tests/test_web026_project_create_regression.py
