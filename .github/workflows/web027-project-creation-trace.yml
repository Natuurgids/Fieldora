name: WEB-027 desktop Project creation trace certification

on:
  pull_request:
    paths:
      - 'src/natureai_next/application/project_management.py'
      - 'src/natureai_next/ui/qt/project_management.py'
      - 'tests/test_web027_project_creation_trace.py'
      - 'docs/web027-project-creation-contract.md'
      - '.github/workflows/web027-project-creation-trace.yml'

permissions:
  contents: read

jobs:
  web027-project-creation-trace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install certification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff WEB-027 trace
        run: python -m ruff check tests/test_web027_project_creation_trace.py
      - name: Desktop Project creation contract trace
        run: pytest -q tests/test_web027_project_creation_trace.py
