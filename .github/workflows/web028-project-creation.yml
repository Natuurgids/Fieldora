name: WEB-028 managed Project creation certification

on:
  pull_request:
    paths:
      - 'src/natureai_next/server/browser_functionality_api.py'
      - 'src/natureai_next/server/browser_functionality_web.py'
      - 'src/natureai_next/server/postgres_project_management.py'
      - 'tests/test_browser_project_management_api.py'
      - 'tests/test_browser_project_management_http.py'
      - '.github/workflows/web028-project-creation.yml'

permissions:
  contents: read

jobs:
  web028-project-creation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install certification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff WEB-028 creation seam
        run: >-
          python -m ruff check
          src/natureai_next/server/browser_functionality_api.py
          src/natureai_next/server/browser_functionality_web.py
          tests/test_browser_project_management_api.py
          tests/test_browser_project_management_http.py
      - name: Managed Project creation contract
        run: >-
          pytest -q
          tests/test_browser_project_management_api.py
          tests/test_browser_project_management_http.py
