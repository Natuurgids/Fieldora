name: WEB-029 Project validation parity certification

on:
  pull_request:
    paths:
      - "src/natureai_next/application/project_management.py"
      - "src/natureai_next/server/browser_functionality_api.py"
      - "src/natureai_next/server/postgres_project_management.py"
      - "tests/test_web029_project_validation.py"
      - ".github/workflows/web029-project-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web029-project-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff WEB-029 validation seam
        run: >-
          python -m ruff check
          tests/test_web029_project_validation.py

      - name: Desktop managed web Project validation parity
        run: pytest -q tests/test_web029_project_validation.py
