name: WEB-031 managed Project lifecycle certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/project_lifecycle_web.py"
      - "src/natureai_next/server/browser_functionality_api.py"
      - "src/natureai_next/server/postgres_project_management.py"
      - "src/natureai_next/server/offline_first_api.py"
      - "src/natureai_next/server/optimistic_concurrency_web.py"
      - "tests/test_web031_project_lifecycle.py"
      - ".github/workflows/web031-project-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web031-project-lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Ruff WEB-031 lifecycle seam
        run: >-
          python -m ruff check
          src/natureai_next/server/project_lifecycle_web.py
          src/natureai_next/server/offline_first_api.py
          tests/test_web031_project_lifecycle.py
      - name: WEB-031 managed lifecycle API and browser actions
        run: python -m pytest -q tests/test_web031_project_lifecycle.py
