name: WEB-032 managed Project hierarchy certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/project_hierarchy_web.py"
      - "src/natureai_next/server/offline_first_api.py"
      - "tests/test_web032_project_hierarchy.py"
      - ".github/workflows/web032-project-hierarchy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web032-project-hierarchy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Ruff WEB-032 hierarchy seam
        run: python -m ruff check src/natureai_next/server/project_hierarchy_web.py src/natureai_next/server/offline_first_api.py tests/test_web032_project_hierarchy.py
      - name: WEB-032 managed hierarchy API and browser actions
        run: python -m pytest -q tests/test_web032_project_hierarchy.py
