name: WEB-033 governed Library evidence detail certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/media_detail_web.py"
      - "src/natureai_next/server/media.py"
      - "src/natureai_next/server/media_links.py"
      - "src/natureai_next/server/linked_storage_browser_api.py"
      - "tests/test_browser_media_detail_http.py"
      - ".github/workflows/web033-library-evidence-detail.yml"
  workflow_dispatch:

jobs:
  web033-library-evidence-detail:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install certification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Ruff WEB-033 evidence detail seam
        run: python -m ruff check src/natureai_next/server/media_detail_web.py tests/test_browser_media_detail_http.py
      - name: Governed Library evidence detail parity
        run: python -m pytest -q tests/test_browser_media_detail_http.py
