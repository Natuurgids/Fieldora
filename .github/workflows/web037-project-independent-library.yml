name: WEB-037 project-independent Library certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/media.py"
      - "src/natureai_next/server/media_links.py"
      - "src/natureai_next/server/browser_functionality_api.py"
      - "tests/test_web037_project_independent_library.py"
      - ".github/workflows/web037-project-independent-library.yml"

permissions:
  contents: read

jobs:
  web037-project-independent-library:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install certification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff WEB-037 project-independent Library seam
        run: >-
          python -m ruff check
          src/natureai_next/server/media.py
          src/natureai_next/server/media_links.py
          src/natureai_next/server/browser_functionality_api.py
          tests/test_web037_project_independent_library.py
      - name: Project-independent Library contract
        run: python -m pytest -q tests/test_web037_project_independent_library.py
