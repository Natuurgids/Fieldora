name: WEB-046 Help and navigation certification

on:
  pull_request:
    paths:
      - "src/natureai_next/resources/server_web/app.js"
      - "src/natureai_next/server/help.py"
      - "src/natureai_next/server/http.py"
      - "src/natureai_next/server/navigation_web_compatibility.py"
      - "src/natureai_next/server/web_capabilities.py"
      - "tests/test_web046_contextual_help.py"
      - "tests/test_server_web_browser_navigation.py"
      - "tests/test_zero_trust_web.py"
      - ".github/workflows/web046-help-navigation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web046-help-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install browser engines
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Ruff WEB-046 Help and navigation seam
        run: >-
          python -m ruff check
          src/natureai_next/server/help.py
          src/natureai_next/server/http.py
          src/natureai_next/server/navigation_web_compatibility.py
          src/natureai_next/server/web_capabilities.py
          tests/test_web046_contextual_help.py
          tests/test_server_web_browser_navigation.py
          tests/test_zero_trust_web.py

      - name: WEB-046 contextual Help across three browsers
        run: pytest -q tests/test_web046_contextual_help.py

      - name: WEB-046 navigation action regression
        run: pytest -q tests/test_server_web_browser_navigation.py

      - name: WEB-046 zero-trust navigation regression
        run: pytest -q tests/test_zero_trust_web.py
