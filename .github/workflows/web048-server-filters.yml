name: WEB-048 Server filter certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/filtering.py"
      - "src/natureai_next/server/pagination.py"
      - "src/natureai_next/server/pagination_api.py"
      - "src/natureai_next/server/offline_first_api.py"
      - "tests/test_web048_server_filters.py"
      - ".github/workflows/web048-server-filters.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web048-server-filters:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff WEB-048 governed server filter seam
        run: >-
          python -m ruff check
          src/natureai_next/server/filtering.py
          src/natureai_next/server/pagination.py
          src/natureai_next/server/pagination_api.py
          src/natureai_next/server/offline_first_api.py
          tests/test_web048_server_filters.py

      - name: WEB-048 authorization-safe server filtering
        run: pytest -q tests/test_web048_server_filters.py

      - name: WEB-047 pagination regression
        run: pytest -q tests/test_web047_pagination.py
