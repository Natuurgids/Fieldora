name: WEB-049 Project idempotency certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/project_idempotency.py"
      - "src/natureai_next/server/project_idempotency_web.py"
      - "src/natureai_next/server/offline_first_api.py"
      - "tests/test_web049_project_idempotency.py"
      - ".github/workflows/web049-project-idempotency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web049-project-idempotency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,server-postgresql]"

      - name: Ruff WEB-049 idempotency seam
        run: >-
          python -m ruff check
          src/natureai_next/server/project_idempotency.py
          src/natureai_next/server/project_idempotency_web.py
          src/natureai_next/server/offline_first_api.py
          tests/test_web049_project_idempotency.py

      - name: WEB-049 retry-safe project mutation contract
        run: pytest -q tests/test_web049_project_idempotency.py
