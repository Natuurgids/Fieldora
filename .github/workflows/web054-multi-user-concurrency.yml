name: WEB-054 multi-user concurrency certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/observation_parity_api.py"
      - "src/natureai_next/server/knowledge_parity_api.py"
      - "src/natureai_next/server/media.py"
      - "src/natureai_next/server/postgres_project_management.py"
      - "tests/test_web054_multi_user_concurrency.py"
      - ".github/workflows/web054-multi-user-concurrency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-user-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fieldora_web054_test
          POSTGRES_USER: fieldora_test
          POSTGRES_PASSWORD: fieldora_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldora_test -d fieldora_web054_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FIELDORA_TEST_POSTGRES_DSN: >-
        postgresql://fieldora_test:fieldora_test_password@127.0.0.1:5432/fieldora_web054_test
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,server-postgresql]"

      - name: Ruff WEB-054 concurrency seam
        run: >-
          python -m ruff check
          src/natureai_next/server/observation_parity_api.py
          src/natureai_next/server/knowledge_parity_api.py
          src/natureai_next/server/media.py
          src/natureai_next/server/postgres_project_management.py
          tests/test_web054_multi_user_concurrency.py

      - name: WEB-054 concurrent users preserve revisions PBAC and identity
        run: pytest -q tests/test_web054_multi_user_concurrency.py
