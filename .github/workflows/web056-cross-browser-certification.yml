name: Fieldora WEB-056 cross-browser workflow certification

on:
  pull_request:
    paths:
      - "src/natureai_next/resources/server_web/**"
      - "src/natureai_next/server/browser_functionality_web.py"
      - "src/natureai_next/server/science_workflow_web.py"
      - "tests/test_web056_cross_browser_workflows.py"
      - ".github/workflows/web056-cross-browser-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web056-cross-browser-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        if: ${{ github.event_name == 'pull_request' }}
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install certification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install Chromium Firefox and WebKit
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Ruff WEB-056 workflow regression
        run: python -m ruff check tests/test_web056_cross_browser_workflows.py

      - name: WEB-056 complete create import link edit review workflows
        run: python -m pytest -q tests/test_web056_cross_browser_workflows.py
