name: Fieldora WEB-057 duplicate bulk Docker runtime certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/browser_functionality_web.py"
      - "src/natureai_next/server/browser_functionality_api.py"
      - "src/natureai_next/server/http.py"
      - "src/natureai_next/server/media.py"
      - "src/natureai_next/server/media_links.py"
      - "src/natureai_next/server/object_storage.py"
      - "tests/test_web057_duplicate_bulk_runtime.py"
      - ".github/workflows/web057-duplicate-bulk-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web057-duplicate-bulk-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: python:3.11-bookworm
      options: --ipc=host
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install certification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8.3,<9" "playwright>=1.48,<2" "ruff>=0.7,<1"

      - name: Install Chromium inside Docker job
        run: python -m playwright install --with-deps chromium

      - name: Ruff WEB-057 runtime scenario
        run: python -m ruff check tests/test_web057_duplicate_bulk_runtime.py

      - name: WEB-057 duplicate and bulk browser runtime scenario
        run: python -m pytest -q tests/test_web057_duplicate_bulk_runtime.py
