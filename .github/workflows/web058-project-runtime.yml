name: Fieldora WEB-058 Project Docker runtime certification

on:
  pull_request:
    paths:
      - "src/natureai_next/server/project_runtime_web.py"
      - "src/natureai_next/server/project_lifecycle_api.py"
      - "src/natureai_next/server/browser_functionality_api.py"
      - "src/natureai_next/server/offline_first_api.py"
      - "src/natureai_next/server/media_links.py"
      - "src/natureai_next/application/project_management.py"
      - "tests/test_web058_project_runtime.py"
      - ".github/workflows/web058-project-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web058-project-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: python:3.11-bookworm
      options: --ipc=host
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install certification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8.3,<9" "playwright>=1.48,<2" "ruff>=0.7,<1"

      - name: Install Chromium inside Docker job
        run: python -m playwright install --with-deps chromium

      - name: Ruff WEB-058 runtime scenario
        run: python -m ruff check src/natureai_next/server/project_runtime_web.py tests/test_web058_project_runtime.py

      - name: WEB-058 Project browser runtime scenario
        run: python -m pytest -q tests/test_web058_project_runtime.py
