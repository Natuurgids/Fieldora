name: Apply Whiteboards navigation to canonical shell

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/whiteboards-apply-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Patch canonical server shell
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/natureai_next/resources/server_web/index.html")
          s = p.read_text(encoding="utf-8")
          nav = '<button class="nav" data-page="help"><span class="nav-icon">?</span>Help &amp; Guides</button>'
          white = '<button class="nav" data-page="whiteboards"><span class="nav-icon">◇</span>Whiteboards</button>'
          page = '<section class="page" id="page-whiteboards" hidden><div class="top"><h1>Whiteboards</h1></div><section class="card"><h2>Collaborative whiteboards</h2><p class="muted">Create and open governed visual workspaces from Fieldora.</p><div class="actions section"><a href="/excalidraw/" target="_blank" rel="noopener"><button class="primary">Open Whiteboards</button></a></div></section></section>'
          anchor = '<section class="page" id="page-help" hidden>'
          if 'data-page="whiteboards"' not in s:
              if nav not in s:
                  raise SystemExit("canonical navigation anchor missing")
              s = s.replace(nav, white + nav, 1)
          if 'id="page-whiteboards"' not in s:
              if anchor not in s:
                  raise SystemExit("canonical page anchor missing")
              s = s.replace(anchor, page + anchor, 1)
          p.write_text(s, encoding="utf-8")
      - name: Verify patch
        run: |
          grep -q 'data-page="whiteboards"' src/natureai_next/resources/server_web/index.html
          grep -q 'id="page-whiteboards"' src/natureai_next/resources/server_web/index.html
          grep -q 'href="/excalidraw/"' src/natureai_next/resources/server_web/index.html
      - name: Commit canonical repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/natureai_next/resources/server_web/index.html
          git commit -m "fix(web): expose Whiteboards in canonical server shell"
          git push
