name: Apply Whiteboards dedupe on feature branch
on:
  push:
    branches: [fix/whiteboards-runtime-certification]
    paths: [".github/workflows/whiteboards-dedupe-branch.yml"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whiteboards-runtime-certification
      - name: Remove obsolete duplicate Whiteboards destination
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/natureai_next/resources/server_web/index.html')
          s=p.read_text(encoding='utf-8')
          duplicate='<button class="nav" data-page="whiteboards"><span class="nav-icon">◇</span>Whiteboards</button>'
          obsolete='<section class="page" id="page-whiteboards" hidden><div class="top"><h1>Whiteboards</h1></div><section class="card"><h2>Collaborative whiteboards</h2><p class="muted">Create and open governed visual workspaces from Fieldora.</p><div class="actions section"><a href="/excalidraw/" target="_blank" rel="noopener"><button class="primary">Open Whiteboards</button></a></div></section></section>'
          if s.count(duplicate) != 1:
              raise SystemExit(f'expected one duplicate nav, found {s.count(duplicate)}')
          if s.count(obsolete) != 1:
              raise SystemExit(f'expected one obsolete page, found {s.count(obsolete)}')
          s=s.replace(duplicate,'',1).replace(obsolete,'',1)
          p.write_text(s,encoding='utf-8')
      - name: Run Whiteboards acceptance tests
        run: python -m pytest -q tests/test_whiteboards_navigation.py tests/test_whiteboards_clean_runtime.py
      - name: Commit repair to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/natureai_next/resources/server_web/index.html
          git commit -m "fix(web): remove duplicate Whiteboards destination"
          git push origin HEAD:fix/whiteboards-runtime-certification
