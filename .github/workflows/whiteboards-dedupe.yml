name: Remove duplicate Whiteboards navigation
on:
  push:
    branches: [main]
    paths: ["tests/test_whiteboards_navigation.py"]
permissions:
  contents: write
jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove accidental second Whiteboards page destination
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/natureai_next/resources/server_web/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace('<button class="nav" data-page="whiteboards"><span class="nav-icon">◇</span>Whiteboards</button>', '', 1)
          start = s.find('<section class="page" id="page-whiteboards" hidden>')
          if start >= 0:
              end = s.find('<section class="page" id="page-help" hidden>', start)
              if end < 0:
                  raise SystemExit("Whiteboards page terminator not found")
              s = s[:start] + s[end:]
          p.write_text(s, encoding="utf-8")
      - name: Verify canonical governed destination
        run: python -m pytest -q tests/test_whiteboards_navigation.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/natureai_next/resources/server_web/index.html
          git diff --cached --quiet || (git commit -m "fix(web): keep one governed Whiteboards destination" && git push)
