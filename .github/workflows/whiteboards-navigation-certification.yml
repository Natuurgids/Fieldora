name: Whiteboards navigation certification

on:
  push:
    branches: [main]
    paths:
      - "src/natureai_next/resources/server_web/index.html"
      - "src/natureai_next/server/desktop_alignment_web.py"
      - "tests/test_whiteboards_navigation.py"
      - ".github/workflows/whiteboards-navigation-certification.yml"
  pull_request:
    paths:
      - "src/natureai_next/resources/server_web/index.html"
      - "src/natureai_next/server/desktop_alignment_web.py"
      - "tests/test_whiteboards_navigation.py"
      - ".github/workflows/whiteboards-navigation-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install certification dependencies
        run: python -m pip install pytest
      - name: Certify canonical shell
        run: python -m pytest -q tests/test_whiteboards_navigation.py
