name: Whiteboards runtime acceptance
on:
  push:
    branches: ["fix/whiteboards-runtime-certification"]
  pull_request:
    paths:
      - "src/natureai_next/server/**"
      - "src/natureai_next/resources/server_web/**"
      - "src/natureai_next/resources/excalidraw/**"
      - "tests/test_whiteboards_clean_runtime.py"
      - ".github/workflows/whiteboards-runtime-acceptance.yml"
permissions:
  contents: read
jobs:
  composed-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project test dependencies
        run: python -m pip install -e . pytest
      - name: Exercise actual composed server
        run: python -m pytest -q tests/test_whiteboards_clean_runtime.py tests/test_whiteboards_navigation.py
