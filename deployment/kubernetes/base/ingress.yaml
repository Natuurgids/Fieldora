apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fieldora
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
spec:
  tls:
    - hosts: [fieldora.example.invalid]
      secretName: fieldora-ingress-tls
  rules:
    - host: fieldora.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fieldora-api
                port:
                  name: http
