apiVersion: v1
kind: Service
metadata:
  name: fieldora-api
spec:
  selector:
    app.kubernetes.io/name: fieldora-api
  ports:
    - name: http
      port: 8765
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fieldora-api
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fieldora-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fieldora-api
    spec:
      serviceAccountName: fieldora
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fieldora-api
      containers:
        - name: api
          image: fieldora/platform:0.11.21
          imagePullPolicy: Always
          args:
            - --data-root
            - /var/lib/fieldora
            - --access-backend
            - postgresql
            - --postgres-access-dsn-file
            - /run/secrets/postgresql-dsn
            - --science-backend
            - postgresql
            - --postgres-science-dsn-file
            - /run/secrets/postgresql-dsn
            - --job-backend
            - postgresql
            - --postgres-jobs-dsn-file
            - /run/secrets/postgresql-dsn
            - --media-metadata-backend
            - postgresql
            - --postgres-media-dsn-file
            - /run/secrets/postgresql-dsn
            - --export-metadata-backend
            - postgresql
            - --postgres-exports-dsn-file
            - /run/secrets/postgresql-dsn
            - --governance-backend
            - postgresql
            - --postgres-governance-dsn-file
            - /run/secrets/postgresql-dsn
            - --media-object-store
            - s3
            - --s3-bucket
            - fieldora-media
            - --s3-export-prefix
            - fieldora/exports
            - --search-backend
            - opensearch
            - --opensearch-endpoint
            - https://opensearch.fieldora.svc:9200
            - serve
            - --host
            - 0.0.0.0
            - --allow-insecure-http
            - --drain-seconds
            - "10"
          ports:
            - name: http
              containerPort: 8765
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: runtime
              mountPath: /var/lib/fieldora
      volumes:
        - name: secrets
          secret:
            secretName: fieldora-runtime
        - name: runtime
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fieldora-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fieldora-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fieldora-worker
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fieldora-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fieldora-worker
    spec:
      serviceAccountName: fieldora
      terminationGracePeriodSeconds: 360
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fieldora-worker
      containers:
        - name: worker
          image: fieldora/platform:0.11.21
          imagePullPolicy: Always
          args:
            - --data-root
            - /var/lib/fieldora
            - --access-backend
            - postgresql
            - --postgres-access-dsn-file
            - /run/secrets/postgresql-dsn
            - --science-backend
            - postgresql
            - --postgres-science-dsn-file
            - /run/secrets/postgresql-dsn
            - --job-backend
            - postgresql
            - --postgres-jobs-dsn-file
            - /run/secrets/postgresql-dsn
            - --media-metadata-backend
            - postgresql
            - --postgres-media-dsn-file
            - /run/secrets/postgresql-dsn
            - --export-metadata-backend
            - postgresql
            - --postgres-exports-dsn-file
            - /run/secrets/postgresql-dsn
            - --media-object-store
            - s3
            - --s3-bucket
            - fieldora-media
            - --s3-export-prefix
            - fieldora/exports
            - --search-backend
            - opensearch
            - --opensearch-endpoint
            - https://opensearch.fieldora.svc:9200
            - run-job-worker
            - --worker-id
            - $(POD_NAME)
            - --max-jobs
            - "10000"
            - --continuous
            - --poll-seconds
            - "2"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: runtime
              mountPath: /var/lib/fieldora
      volumes:
        - name: secrets
          secret:
            secretName: fieldora-runtime
        - name: runtime
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fieldora-worker
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fieldora-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fieldora
automountServiceAccountToken: false
