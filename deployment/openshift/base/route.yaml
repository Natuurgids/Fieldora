apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fieldora
spec:
  host: fieldora.apps.example.invalid
  to:
    kind: Service
    name: fieldora-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
