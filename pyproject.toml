[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "natureai-next"
version = "5.4.0"
description = "Fieldora: offline biodiversity research and scientific project workspace"
readme = "PROJECT_SPEC.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "NatureAI Next" }]
dependencies = [
  "packaging>=24,<26",
  "platformdirs>=4.2,<5",
  "Pillow>=11,<13",
  "rawpy>=0.19.1,<0.26",
  "pyshp>=2.3,<3",
  "cryptography>=44,<47",
  "defusedxml>=0.7,<1",
  "typing-extensions>=4.12,<5; python_version < '3.12'",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8,<2",
  "coverage[toml]>=7.6,<8",
  "import-linter>=2.1,<3",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "semgrep>=1.100,<2",
]
gui = ["PySide6>=6.8,<6.9"]
ai = ["torch>=2.5,<2.8", "torchvision>=0.20,<0.23", "open-clip-torch>=2.30,<3", "huggingface-hub>=0.27,<1", "hnswlib>=0.8,<0.9", "pybioclip==2.1.5"]
document-ai = ["PyMuPDF>=1.24,<2", "rapidocr-onnxruntime>=1.4,<2", "numpy>=1.26,<3"]
server-s3 = ["boto3>=1.35,<2"]
server-postgresql = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
natureai-next = "natureai_next.bootstrap.cli:main"
natureai-next-admin = "natureai_next.bootstrap.admin_cli:main"
natureai-next-resources = "natureai_next.bootstrap.resource_cli:main"
fieldora-server = "natureai_next.bootstrap.platform_server_cli:main"
fieldora-server-recovery = "natureai_next.bootstrap.server_recovery_cli:main"
fieldora-deployment-assessment = "natureai_next.bootstrap.deployment_assessment_cli:main"
fieldora-record-phase-f-evidence = "natureai_next.bootstrap.phase_f_evidence_cli:main"
fieldora-recovery-assessment = "natureai_next.bootstrap.recovery_assessment_cli:main"
fieldora-governance = "natureai_next.bootstrap.governance_cli:main"
fieldora-retention = "natureai_next.bootstrap.retention_cli:main"
fieldora-secret-rotation = "natureai_next.bootstrap.secret_rotation_cli:main"
fieldora-audit-export = "natureai_next.bootstrap.audit_export_cli:main"
fieldora-phase-f-certification = "natureai_next.bootstrap.phase_f_certification_cli:main"
fieldora-service-trust = "natureai_next.bootstrap.service_trust_cli:main"
fieldora-certificate-renewer = "natureai_next.bootstrap.certificate_renewer_cli:main"
fieldora-operator = "natureai_next.bootstrap.operator_cli:main"
aperture-updater = "natureai_next.bootstrap.native_updater:main"
aperture-recovery = "natureai_next.bootstrap.native_recovery:main"

[project.gui-scripts]
fieldora = "natureai_next.bootstrap.aperture_launcher:main"
fieldora-maintenance-center = "natureai_next.bootstrap.maintenance_center:main"
fieldora-backup-recovery = "natureai_next.bootstrap.maintenance_center:main"
fieldora-manuals = "natureai_next.bootstrap.manuals_app:main"
# Compatibility aliases for existing installations; new links use Fieldora names.
aperture = "natureai_next.bootstrap.aperture_launcher:main"
aperture-maintenance-center = "natureai_next.bootstrap.maintenance_center:main"
aperture-backup-recovery = "natureai_next.bootstrap.maintenance_center:main"

[tool.hatch.build.targets.wheel]
packages = ["src/natureai_next"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG", "S"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_errors = true
mypy_path = "src"
packages = ["natureai_next"]
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "contract: stable API and adapter contract tests",
  "integration: integration tests",
  "migration: schema or configuration migration tests",
  "performance: repeatable performance tests",
]

[tool.coverage.run]
branch = true
source = ["natureai_next"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.importlinter]
root_package = "natureai_next"

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["natureai_next.domain"]
forbidden_modules = [
  "natureai_next.application",
  "natureai_next.ports",
  "natureai_next.infrastructure",
  "natureai_next.bootstrap",
  "natureai_next.server",
]

[[tool.importlinter.contracts]]
name = "Application does not import infrastructure or bootstrap"
type = "forbidden"
source_modules = ["natureai_next.application"]
forbidden_modules = [
  "natureai_next.infrastructure",
  "natureai_next.bootstrap",
]

[[tool.importlinter.contracts]]
name = "Ports do not import infrastructure or bootstrap"
type = "forbidden"
source_modules = ["natureai_next.ports"]
forbidden_modules = [
  "natureai_next.infrastructure",
  "natureai_next.bootstrap",
]

[[tool.importlinter.contracts]]
name = "Infrastructure does not import bootstrap"
type = "forbidden"
source_modules = ["natureai_next.infrastructure"]
forbidden_modules = ["natureai_next.bootstrap"]

[[tool.importlinter.contracts]]
name = "GUI does not import infrastructure"
type = "forbidden"
source_modules = ["natureai_next.gui"]
forbidden_modules = ["natureai_next.infrastructure"]
